<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="16" viewBox="0 0 1000 16" role="img" aria-label="divider">
<style>@keyframes run{from{transform:translateX(-260px)}to{transform:translateX(1000px)}}.run{animation:run 3.2s cubic-bezier(.6,0,.3,1) infinite;}</style>
<defs><linearGradient id="p" x1="0" x2="1"><stop offset="0" stop-color="#e10600" stop-opacity="0"/><stop offset=".85" stop-color="#ff2a2a"/><stop offset="1" stop-color="#fff"/></linearGradient>
<pattern id="c" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#d9dbe0"/><rect x="4" y="4" width="4" height="4" fill="#d9dbe0"/></pattern></defs>
<rect x="0" y="7" width="910" height="2" fill="#3a3f4b"/>
<rect class="run" x="0" y="6" width="260" height="4" rx="2" fill="url(#p)"/>
<g transform="skewX(-20)"><rect x="920" y="0" width="40" height="16" fill="url(#c)"/><rect x="966" y="0" width="30" height="16" fill="#e10600"/></g>
</svg>