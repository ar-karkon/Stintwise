[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stintwise"
version = "0.1.0"
description = "Endurance race strategy toolkit for WEC-style racing: stint planning, caution pit calls and timing-data analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stintwise contributors" }]
dependencies = [
  "fastapi>=0.110,<1.0",
  "pydantic>=2.6,<3",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
stintwise = "stintwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stintwise = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Body() defaults
